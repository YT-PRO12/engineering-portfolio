name: Publish reviewed Software Engineer resume
on:
  push:
    branches: ['fix/recruiter-ready-resume-20261103']
    paths:
      - 'scripts/build_resume_assets.py'
      - '.github/workflows/publish-sde-resume-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-to-review-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reproducible resume tools
        run: |
          python -m pip install 'python-docx>=1.1,<2' 'pypdf>=5,<7'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - name: Generate updated resume
        run: python scripts/build_resume_assets.py
      - name: Verify generated resume
        run: |
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          from pypdf import PdfReader
          root=Path('public/resume')
          doc=Document(root/'Yatharth_Goyal_Resume.docx')
          pdf=PdfReader(str(root/'Yatharth_Goyal_Resume.pdf'))
          assert len(pdf.pages)==1, "SDE resume must fit on one page"
          text=pdf.pages[0].extract_text()
          for term in ('AegisED','EvalForge','Grid Flex','EduPredict AI','9.00/10.00'):
              assert term in text, f'Missing: {term}'
          for term in ('RouteGuard','macro-F1','0.7893','ML ENGINEER'):
              assert term not in text, f'Stale: {term}'
          assert 'EDUCATION & CERTIFICATIONS' in text
          assert text.index('EDUCATION & CERTIFICATIONS') > text.index('EduPredict AI')
          assert doc.styles['Normal'].font.size.pt>=10
          print('Verified: one-page, corrected projects, 10pt+ editable document')
          PY
      - name: Commit only verified SDE resume artifacts to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/resume/Yatharth_Goyal_Resume.docx public/resume/Yatharth_Goyal_Resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: synchronize reviewed SDE DOCX and PDF"
            git push origin HEAD:fix/recruiter-ready-resume-20261103
          fi
