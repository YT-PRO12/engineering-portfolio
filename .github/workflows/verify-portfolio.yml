name: Verify portfolio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'python-docx>=1.1,<2' 'pypdf>=5,<7'
      - run: python scripts/check_assets.py
      - run: python scripts/check_demo_disclosures.py
      - run: python scripts/check_case_study_pages.py
      - run: python scripts/check_social_preview_assets.py
      - run: python scripts/check_case_study_social_titles.py
