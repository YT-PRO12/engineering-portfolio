name: Verify official recruiter resume
on:
  push:
    branches: [main]
    paths:
      - 'public/resume/**'
      - 'public/certificates/**'
      - 'scripts/check_assets.py'
      - '.github/workflows/sync-resumes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-official-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate original uploaded PDF and repository evidence
        run: |
          python -m pip install 'pypdf>=5,<7'
          python scripts/check_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: verified-official-recruiter-resume
          path: public/resume/Yatharth_Goyal_Resume.pdf
          if-no-files-found: error
