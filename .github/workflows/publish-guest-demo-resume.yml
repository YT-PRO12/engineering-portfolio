name: Publish reviewed recruiter demo resume
on:
  push:
    branches: [feat/recruiter-guest-live-demo-showcase-20261103]
    paths:
      - 'scripts/publish_guest_demo_resume.py'
      - '.github/workflows/publish-guest-demo-resume.yml'
permissions:
  contents: write
jobs:
  update-official-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF editor
        run: python -m pip install 'PyMuPDF>=1.24,<2'
      - name: Update verified one-page PDF with guest demos
        run: python scripts/publish_guest_demo_resume.py
      - name: Save only the reviewed PDF to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/resume/Yatharth_Goyal_Resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "resume: link all four no-login demo experiences"
            git push origin HEAD:feat/recruiter-guest-live-demo-showcase-20261103
          fi
